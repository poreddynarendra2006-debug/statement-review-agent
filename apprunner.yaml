# AWS App Runner service configuration.
#
# Used when App Runner builds from source. When deploying a prebuilt image
# from ECR - which is what our CI does - the same settings live on the service
# itself and this file documents them. Set the service health check path to
# /health.

version: 1.0
runtime: docker

build:
  commands:
    build:
      - echo "Image is built in GitHub Actions and pushed to ECR"

run:
  command: ./entrypoint.sh
  network:
    port: 8000
    env: PORT
  env:
    - name: LOG_LEVEL
      value: INFO
    - name: SQLITE_DB_PATH
      value: /app/var/finsight_review.db
    - name: AWS_REGION
      value: ap-south-1
