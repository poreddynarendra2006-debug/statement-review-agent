name: Deploy to AWS

# Tests the code, builds the image, pushes it to Amazon ECR, moves the AuditLens
# service on ECS Express Mode onto it, and checks the live /health endpoint.
#
# Authentication is by GitHub OIDC: the job exchanges a short-lived token for an
# AWS role, so no AWS access key is stored in this repository.
#
# One-time setup is in docs/DEPLOYMENT.md, section 6. Repository variables
# (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_REGION        ap-south-1
#   AWS_ROLE_ARN      the role this workflow may assume
#   ECR_REPOSITORY    statement-review
#   ECS_SERVICE_ARN   arn:aws:ecs:ap-south-1:<account-id>:service/default/auditlens
#   APP_URL           the service's Application URL, without a trailing slash

on:
  # Manual: Actions -> Deploy to AWS -> Run workflow.
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

jobs:
  test:
    name: Run the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

  deploy:
    name: Build, push and deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # Tagged with the commit, so every release in ECR is also a rollback point.
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to ECS Express Mode
        run: |
          # Only the image changes; port, health check, variables and scaling stay.
          aws ecs update-express-gateway-service \
            --service-arn "${{ vars.ECS_SERVICE_ARN }}" \
            --primary-container "image=$IMAGE" \
            --region "${{ vars.AWS_REGION }}" \
            --no-cli-pager > /dev/null

      - name: Wait for the new version to take over
        run: |
          SERVICE_ARN="${{ vars.ECS_SERVICE_ARN }}"
          aws ecs wait services-stable \
            --cluster "$(echo "$SERVICE_ARN" | cut -d/ -f2)" \
            --services "$SERVICE_ARN" \
            --region "${{ vars.AWS_REGION }}"

      - name: Check the live health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "${{ vars.APP_URL }}/health"; then
              echo
              echo "Deployed ${{ github.sha }} to ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "The service did not report healthy after the deploy." >&2
          exit 1
