name: Deploy to AWS

# Builds the image, pushes it to ECR and tells App Runner to deploy it.
#
# Authentication is by OIDC: GitHub exchanges a short-lived token for an AWS
# role. No long-lived AWS access key is stored in this repository, which is
# the single most common way student projects get compromised.
#
# Required repository variables:
#   AWS_REGION          e.g. ap-south-1
#   AWS_ROLE_ARN        role GitHub is allowed to assume
#   ECR_REPOSITORY      e.g. finsight-ai
#   APPRUNNER_SERVICE_ARN
#
# Set them under Settings -> Secrets and variables -> Actions -> Variables.

on:
  # Manual only until the AWS resources exist and the four repository
  # variables below are set. Restore the push trigger once a deploy succeeds,
  # so a red build then means something is actually broken.
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          # Tag with the commit SHA as well as latest, so a rollback is
          # simply redeploying an earlier tag.
          docker build -t "$REGISTRY/$REPOSITORY:$GITHUB_SHA" \
                       -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Deploy to App Runner
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Report the deployed image
        run: |
          echo "Deployed $GITHUB_SHA to App Runner" >> "$GITHUB_STEP_SUMMARY"
